name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile tools, check PowerShell, and test dispatch gate
        shell: powershell
        run: .\tests\Test.ps1
      - name: Build portable package
        shell: powershell
        run: .\Package.ps1
